<!DOCTYPE html>
<html lang="pt-BR" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#09090b">
  <title>Ordens de Serviço · AutoCRM</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22><rect width=%2224%22 height=%2224%22 rx=%226%22 fill=%22%23ff7a59%22/><text x=%2212%22 y=%2217%22 font-size=%2214%22 text-anchor=%22middle%22 fill=%22%231a0700%22 font-family=%22Arial%22 font-weight=%22bold%22>A</text></svg>">
  <script>(function(){try{var t=localStorage.getItem('autocrm_tema');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-bs-theme',t);}catch(e){}})();</script>
  <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.8/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.13.1/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="main-area">
      <header class="topbar" id="topbar"></header>
      <main class="page-content" id="paginaOrdens">

        <div class="toolbar-page">
          <div class="d-flex flex-wrap align-items-center gap-2">
            <div class="busca-wrap">
              <i class="bi bi-search"></i>
              <input type="text" class="form-control" id="campoBusca" placeholder="Cliente, placa ou nº da OS..." aria-label="Buscar ordens">
              <span class="atalho-busca d-none d-md-inline">/</span>
            </div>
            <div class="d-flex flex-wrap gap-1" id="chipsStatus"></div>
            <select class="form-select d-none" id="filtroStatus">
              <option value="">Todos os status</option>
              <option value="agendado">Agendado</option>
              <option value="em_andamento">Em andamento</option>
              <option value="concluido">Concluído</option>
              <option value="cancelado">Cancelado</option>
            </select>
          </div>
          <div class="d-flex align-items-center gap-2">
            <span class="contador-lista" id="contadorOrdens"></span>
            <div class="seg-control" role="group" aria-label="Modo de visualização">
              <button type="button" id="btnViewKanban" class="ativo"><i class="bi bi-kanban me-1"></i>Quadro</button>
              <button type="button" id="btnViewTabela"><i class="bi bi-table me-1"></i>Lista</button>
            </div>
            <button type="button" class="btn btn-primary" id="btnNovaOrdem"><i class="bi bi-plus-lg me-1"></i>Nova OS</button>
          </div>
        </div>

        <div id="viewKanban">
          <div class="kanban" id="quadroKanban"></div>
        </div>

        <div id="viewTabela" class="d-none">
          <div class="panel p-0">
            <div class="table-responsive">
              <table class="table table-hover align-middle mb-0">
                <thead>
                  <tr>
                    <th>OS</th>
                    <th>Cliente / Veículo</th>
                    <th>Serviços</th>
                    <th>Responsável</th>
                    <th>Status</th>
                    <th>Pagamento</th>
                    <th>Valor</th>
                    <th>Agendada para</th>
                    <th class="text-end">Ações</th>
                  </tr>
                </thead>
                <tbody id="corpoTabelaOrdens"></tbody>
              </table>
            </div>
          </div>
        </div>

      </main>
    </div>
  </div>

  <!-- Modal: Nova/Editar Ordem de Serviço -->
  <div class="modal fade" id="modalOrdem" tabindex="-1">
    <div class="modal-dialog modal-lg modal-dialog-centered">
      <div class="modal-content">
        <form id="formOrdem">
          <div class="modal-header">
            <h5 class="modal-title" id="tituloModalOrdem">Nova Ordem de Serviço</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body">
            <input type="hidden" id="ordemId">
            <div class="row g-3">
              <div class="col-md-6">
                <label class="form-label">Cliente *</label>
                <select class="form-select" id="ordemCliente" required></select>
              </div>
              <div class="col-md-6">
                <label class="form-label">Veículo *</label>
                <select class="form-select" id="ordemVeiculo" required disabled></select>
                <div class="form-text" id="avisoSemVeiculo"></div>
              </div>
              <div class="col-md-6">
                <label class="form-label">Responsável</label>
                <select class="form-select" id="ordemResponsavel"></select>
              </div>
              <div class="col-md-6">
                <label class="form-label">Agendada para *</label>
                <input type="datetime-local" class="form-control" id="ordemData" required>
              </div>

              <div class="col-12">
                <label class="form-label">Serviços *</label>
                <div class="item-servico-row">
                  <div class="row g-2 align-items-end">
                    <div class="col-md-5">
                      <select class="form-select form-select-sm" id="itemCatalogo">
                        <option value="">— escolha do catálogo —</option>
                        <option value="__outro__">Outro (digitar manualmente)</option>
                      </select>
                    </div>
                    <div class="col-md-4">
                      <input type="text" class="form-control form-control-sm" id="itemNome" placeholder="Descrição do serviço">
                    </div>
                    <div class="col-md-2">
                      <input type="number" class="form-control form-control-sm" id="itemValor" placeholder="R$" min="0" step="0.01">
                    </div>
                    <div class="col-md-1">
                      <button type="button" class="btn btn-sm btn-primary w-100" id="btnAdicionarItem"><i class="bi bi-plus-lg"></i></button>
                    </div>
                  </div>
                </div>
                <div id="listaItensOrdem" class="mb-1"></div>
                <div class="text-end fw-bold" style="font-size:.95rem;">Total: <span id="totalOrdem">R$ 0,00</span></div>
              </div>

              <div class="col-12">
                <label class="form-label">Observações</label>
                <textarea class="form-control" id="ordemObservacoes" rows="2"></textarea>
              </div>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancelar</button>
            <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg me-1"></i>Salvar ordem de serviço</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- Modal: Registrar Pagamento -->
  <div class="modal fade" id="modalPagamento" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <form id="formPagamento">
          <div class="modal-header">
            <h5 class="modal-title">Registrar pagamento — OS #<span id="pagamentoNumeroOS"></span></h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body">
            <input type="hidden" id="pagamentoOrdemId">
            <div class="d-flex justify-content-between text-muted-2 mb-3" style="font-size:.85rem;">
              <span>Total da OS: <strong id="pagamentoValorTotal" style="color:var(--acrm-text)"></strong></span>
              <span>Já pago: <strong id="pagamentoValorPago" style="color:var(--acrm-text)"></strong></span>
              <span>Restante: <strong id="pagamentoValorRestante" style="color:var(--acrm-warning)"></strong></span>
            </div>
            <div class="row g-3">
              <div class="col-md-6">
                <label class="form-label">Valor a registrar *</label>
                <input type="number" class="form-control" id="pagamentoValor" min="0.01" step="0.01" required>
              </div>
              <div class="col-md-6">
                <label class="form-label">Forma de pagamento *</label>
                <select class="form-select" id="pagamentoForma" required>
                  <option value="Pix">Pix</option>
                  <option value="Dinheiro">Dinheiro</option>
                  <option value="Cartão de Débito">Cartão de Débito</option>
                  <option value="Cartão de Crédito">Cartão de Crédito</option>
                  <option value="Transferência">Transferência</option>
                </select>
              </div>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancelar</button>
            <button type="submit" class="btn btn-primary"><i class="bi bi-cash-coin me-1"></i>Registrar pagamento</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.8/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/db.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/ui.js"></script>
  <script src="assets/js/ordens.js"></script>
</body>
</html>
